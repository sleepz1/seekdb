name: Contest SDB07 same-runner FTS comparison
on:
  push:
    branches: [contest/sdb07-fts-repair]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contest-sdb07-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install release prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl rpm rpm2cpio cpio make build-essential binutils m4 file python3 python3-venv libncurses5 libtool-bin libaio1 ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/sdb07-ccache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sdb07-ccache"
          df -h .
          free -h
          lscpu
      - name: Restore pinned dependencies
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            deps/3rd
            ~/.cargo/registry
            ~/.cargo/git
          key: sdb04-deps-${{ runner.os }}-${{ hashFiles('deps/init/**', 'rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/sdb07-ccache
          key: sdb07-ccache-v1-${{ runner.os }}-${{ hashFiles('deps/init/**') }}-${{ github.sha }}
          restore-keys: |
            sdb07-ccache-v1-${{ runner.os }}-${{ hashFiles('deps/init/**') }}-
            sdb04-ccache-v1-${{ runner.os }}-${{ hashFiles('deps/init/**') }}-
      - name: Configure identical release compiler
        run: |
          set -o pipefail
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          bash build.sh release --init -DCMAKE_C_COMPILER_LAUNCHER=/usr/bin/ccache -DCMAKE_CXX_COMPILER_LAUNCHER=/usr/bin/ccache 2>&1 | tee configure.log
          echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/sdb07-venv"
          "$RUNNER_TEMP/sdb07-venv/bin/pip" install PyMySQL==1.1.1
      - name: Compile and compare unchanged parent, original submission, and repair
        run: bash unittest/storage/fts/run_contest_comparison.sh
      - name: Stop disposable instance
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/sdb07-instance"; then
            python3 .github/script/seekdb/sdb.py stop --base-dir "$RUNNER_TEMP/sdb07-instance" || true
          fi
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/sdb07-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Preserve benchmark and correctness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdb07-fts-comparison
          path: |
            configure.log
            sdb07-evidence/
          retention-days: 7
