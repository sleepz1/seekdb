          for item in edits:
              path = item['path']
              raw = pathlib.Path(path).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == item['expected'], path
              text = raw.decode()
              for old, new, expected_count in item['replacements']:
                  assert text.count(old) == expected_count, (path, old)
                  text = text.replace(old, new)
              add(path, text.encode())
          base = api('GET', 'git/commits/' + parent)['tree']['sha']
          new_tree = api('POST', 'git/trees', {'base_tree': base, 'tree': entries})['sha']
          commit = api('POST', 'git/commits', {'message': 'fix(ai): validate completion content and read nullable native credentials', 'tree': new_tree, 'parents': [parent]})['sha']
          api('PATCH', 'git/refs/heads/contest/sdb04-ai-repair', {'sha': commit, 'force': False})
          print('Reviewed repair committed on isolated branch:', commit)
          PY
