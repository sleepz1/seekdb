name: Prepare isolated contest source repair
on:
  push:
    branches: [contest/sdb04-codex-repair]
    paths: [.github/workflows/contest-sdb04-source-patch.yml]
permissions:
  contents: read
jobs:
  apply-reviewed-source:
    if: github.repository == 'sleepz1/seekdb' && github.ref == 'refs/heads/contest/sdb04-codex-repair'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply fixed patch and immutable regression artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'sleepz1/seekdb'
          assert os.environ['GITHUB_REF'] == 'refs/heads/contest/sdb04-codex-repair'
          parent = os.environ['GITHUB_SHA']
          def api(method, suffix, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + suffix, data=body, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          tree = []
          def add(path, raw):
              blob = api('POST', 'git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              tree.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          edits = [
              ('src/sql/engine/expr/ob_expr_ai/ob_expr_ai_embed.cpp', '9951f4d24dad185aee0baf28435f0c039be7767f', '#include "ob_expr_lob_utils.h"', '#include "sql/engine/expr/ob_expr_lob_utils.h"'),
              ('src/sql/engine/expr/ob_expr_ai/ob_expr_ai_prompt.cpp', '28a2aef2054329dfcb61b17794bb79dd6d74a0d1', '#include "ob_expr_json_func_helper.h"', '#include "sql/engine/expr/ob_expr_json_func_helper.h"'),
          ]
          for path, expected, old, new in edits:
              raw = pathlib.Path(path).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == expected, path
              text = raw.decode()
              assert text.count(old) == 1, path
              add(path, text.replace(old, new).encode())
          manifest = [{"path":"unittest/sql/engine/expr/check_ai_translation_units.py","chunks":["1bbf508949c47bb7dd834d90f68d055889ca49b4","0f884dd49f126f0a4ce51e4ce143442ce14d7002","0bcaa982a0dc59e72738a8c5b704d28b9838952a"]},{"path":"unittest/sql/engine/expr/test_ai_contest_runtime.py","chunks":["1c74f06c14dc68a6c2a80e453c759e9d98e974ba","0af4c156ec41e2e6e5811537f20b0c23ce11766c","3bf9c20113078cd5809441f5816671c6e1d9f5d2","1397e437e374df49ea6a9ea26a41115dacb995ac","0e3a73b887fbdf58eac176a476fa379ff72a55f5","280d1a7908fef34139912972b257996fb815b37c"]},{"path":"docs/superpowers/plans/2026-10-27-ai-contest-repair.md","chunks":["4a3cf6e23f2842bce443ac25251f4a5afa4e628b"]}]
          for item in manifest:
              chunks = []
              for sha in item['chunks']:
                  blob = api('GET', 'git/blobs/' + sha)
                  assert blob['sha'] == sha and blob['encoding'] == 'base64'
                  raw = base64.b64decode(blob['content'])
                  assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
                  chunks.append(raw)
              add(item['path'], b''.join(chunks))
          base = api('GET', 'git/commits/' + parent)['tree']['sha']
          new_tree = api('POST', 'git/trees', {'base_tree': base, 'tree': tree})['sha']
          commit = api('POST', 'git/commits', {'message': 'fix(ai): repair header paths and add real compile/runtime regressions', 'tree': new_tree, 'parents': [parent]})['sha']
          api('PATCH', 'git/refs/heads/contest/sdb04-codex-repair', {'sha': commit, 'force': False})
          print('Reviewed repair committed on isolated branch:', commit)
          PY
