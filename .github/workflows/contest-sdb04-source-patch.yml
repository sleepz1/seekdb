name: Prepare isolated contest source repair
on:
  push:
    branches: [contest/sdb04-ai-repair]
    paths: [.github/workflows/contest-sdb04-source-patch.yml]
permissions:
  contents: read
jobs:
  apply-reviewed-source:
    if: github.repository == 'sleepz1/seekdb' && github.ref == 'refs/heads/contest/sdb04-ai-repair'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply fixed patch and immutable regression artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'sleepz1/seekdb'
          assert os.environ['GITHUB_REF'] == 'refs/heads/contest/sdb04-ai-repair'
          parent = os.environ['GITHUB_SHA']
          def api(method, suffix, data=None):
              body = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + suffix, data=body, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          def add(path, raw):
              blob = api('POST', 'git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
