name: Prepare isolated contest source repair
on:
  push:
    branches: [contest/sdb04-ai-repair]
    paths: [.github/workflows/contest-sdb04-source-patch.yml]
permissions:
  contents: read
jobs:
  apply-reviewed-source:
    if: github.repository == 'sleepz1/seekdb' && github.ref == 'refs/heads/contest/sdb04-ai-repair'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply fixed patch and immutable regression artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'sleepz1/seekdb'
          assert os.environ['GITHUB_REF'] == 'refs/heads/contest/sdb04-ai-repair'
          parent = os.environ['GITHUB_SHA']
          def api(method, suffix, data=None):
              body = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + suffix, data=body, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          def add(path, raw):
              blob = api('POST', 'git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          edits = [{"path":"src/sql/resolver/dml/ob_dml_resolver.cpp","expected":"ce71b502c60fa038c7f3abc702c82cb2b01da80e","replacements":[["session_info_->get_bool_sys_var(share::SYS_VAR_ENABLE_FILE_SQL, enabled)","session_info_->get_sys_variable(share::SYS_VAR_ENABLE_FILE_SQL, enabled)",1]]},{"path":"src/sql/resolver/dml/ob_select_resolver.cpp","expected":"27a028a1cc97e161f97f8d443c958f2bb28be704","replacements":[["session_info_->get_bool_sys_var(share::SYS_VAR_ENABLE_FILE_SQL, enabled)","session_info_->get_sys_variable(share::SYS_VAR_ENABLE_FILE_SQL, enabled)",1]]}]
          for item in edits:
              path = item['path']
              raw = pathlib.Path(path).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == item['expected'], path
              text = raw.decode()
              for old, new, expected_count in item['replacements']:
                  assert text.count(old) == expected_count, (path, old)
                  text = text.replace(old, new)
              add(path, text.encode())
          base = api('GET', 'git/commits/' + parent)['tree']['sha']
          new_tree = api('POST', 'git/trees', {'base_tree': base, 'tree': entries})['sha']
          commit = api('POST', 'git/commits', {'message': 'fix(file-sql): use public session boolean sysvar accessor', 'tree': new_tree, 'parents': [parent]})['sha']
          api('PATCH', 'git/refs/heads/contest/sdb04-ai-repair', {'sha': commit, 'force': False})
          print('Reviewed repair committed on isolated branch:', commit)
          PY
