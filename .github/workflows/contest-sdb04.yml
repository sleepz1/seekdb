name: Contest SDB04 compile and runtime
on:
  push:
    branches: [contest/sdb04-codex-repair]
    paths: ['src/**', 'unittest/**', 'docs/superpowers/plans/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contest-sdb04-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observer-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install documented build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl rpm rpm2cpio cpio make build-essential binutils m4 file python3 python3-venv libncurses5 libtool-bin libaio1 ccache
          df -h .
          free -h
          echo "CCACHE_DIR=$RUNNER_TEMP/sdb04-ccache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sdb04-ccache"
      - name: Restore pinned dependencies
        id: deps
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            deps/3rd
            ~/.cargo/registry
            ~/.cargo/git
          key: sdb04-deps-${{ runner.os }}-${{ hashFiles('deps/init/**', 'rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/sdb04-ccache
          key: sdb04-ccache-v1-${{ runner.os }}-${{ hashFiles('deps/init/**') }}-${{ github.sha }}
          restore-keys: sdb04-ccache-v1-${{ runner.os }}-${{ hashFiles('deps/init/**') }}-
      - name: Configure official release with compiler cache
        id: configure
        run: |
          set -o pipefail
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          bash build.sh release --init -DCMAKE_C_COMPILER_LAUNCHER=/usr/bin/ccache -DCMAKE_CXX_COMPILER_LAUNCHER=/usr/bin/ccache 2>&1 | tee configure.log
          echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Save initialized dependencies before compilation
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            deps/3rd
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Compile real production AI Unity source before full build
        run: |
          python3 unittest/sql/engine/expr/check_ai_translation_units.py --repo "$GITHUB_WORKSPACE" --build-dir build_release --source src/sql/engine/expr/ob_expr_ai/ob_expr_ai_rerank.cpp --mode unity --prepare auto --jobs 2 --timeout 600 --log-dir ai-syntax-probe-logs
      - name: Compile complete seekdb binary
        run: |
          set -o pipefail
          cmake --build build_release --target seekdb -j4 2>&1 | tee build.log
          test -x build_release/src/observer/seekdb
      - name: Existing contest checks
        run: |
          set -o pipefail
          python3 unittest/sql/engine/expr/ai_function_contest_check.py 2>&1 | tee existing-ai-check.log
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -I. -o "$RUNNER_TEMP/test_file_scan" unittest/sql/engine/basic/test_file_scan_utils.cpp
          "$RUNNER_TEMP/test_file_scan" "$RUNNER_TEMP/file-sql-data"
      - name: Start actual newly compiled seekdb
        run: |
          python3 -m venv "$RUNNER_TEMP/sdb04-venv"
          "$RUNNER_TEMP/sdb04-venv/bin/pip" install PyMySQL==1.1.1
          python3 .github/script/seekdb/sdb.py start --binary "$GITHUB_WORKSPACE/build_release/src/observer/seekdb" --base-dir "$RUNNER_TEMP/sdb04-instance" --port 2881 --parameter memory_limit=4G --parameter datafile_size=2G --parameter log_disk_size=2G
          python3 .github/script/seekdb/sdb.py wait-ready --client "$GITHUB_WORKSPACE/deps/3rd/u01/obclient/bin/obclient" --base-dir "$RUNNER_TEMP/sdb04-instance" --host 127.0.0.1 --port 2881 --user root --timeout 180
          deps/3rd/u01/obclient/bin/obclient -h127.0.0.1 -P2881 -uroot -e 'CREATE DATABASE IF NOT EXISTS test;'
      - name: Real SQL AI runtime regression
        run: |
          set -o pipefail
          "$RUNNER_TEMP/sdb04-venv/bin/python" unittest/sql/engine/expr/test_ai_contest_runtime.py --host 127.0.0.1 --port 2881 --ai-port 8000 --database test 2>&1 | tee runtime-ai.log
      - name: Stop this disposable test instance
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/sdb04-instance"; then
            python3 .github/script/seekdb/sdb.py stop --base-dir "$RUNNER_TEMP/sdb04-instance" || true
          fi
      - name: Save compiler cache including failed compilation evidence
        if: always() && steps.configure.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/sdb04-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Preserve actual diagnostics
        if: always()
        run: |
          for f in configure.log build.log existing-ai-check.log runtime-ai.log; do
            if test -f "$f"; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              grep -n -E -C 2 'error:|fatal error:|FAILED|Error [0-9]+|passed|check: ok|Ran [0-9]+ tests' "$f" | head -n 100 >> "$GITHUB_STEP_SUMMARY" || true
            fi
          done
      - name: Upload build and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdb04-build-evidence
          path: |
            configure.log
            build.log
            existing-ai-check.log
            runtime-ai.log
            ai-syntax-probe-logs/
            build_release/compile_commands.json
          retention-days: 3
