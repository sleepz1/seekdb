name: ae01-bootstrap
on:
  push:
    branches: [ 'ci/ae01-bootstrap' ]
permissions:
  contents: write
jobs:
  chmod:
    runs-on: ubuntu-latest
    steps:
      - name: restore executable bit on tools/hipvs_bridge/build.sh
        shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API=https://api.github.com/repos/${GITHUB_REPOSITORY}
          H=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          HEAD=$(curl -sS "${H[@]}" $API/git/ref/heads/contest/ae01-hipvs | jq -r .object.sha)
          [ "$HEAD" = "ec599ca82938e4385e017dc0681b804c66aca717" ] || { echo "::error::unexpected head $HEAD"; exit 1; }
          BTREE=$(curl -sS "${H[@]}" $API/git/commits/$HEAD | jq -r .tree.sha)
          BLOB=072abe4f1e61c726431c9afc1ce9a6b6cfafd953
          NT=$(curl -sS "${H[@]}" -X POST $API/git/trees -d "{\"base_tree\":\"$BTREE\",\"tree\":[{\"path\":\"tools/hipvs_bridge/build.sh\",\"mode\":\"100755\",\"type\":\"blob\",\"sha\":\"$BLOB\"}]}" | jq -r .sha)
          NC=$(curl -sS "${H[@]}" -X POST $API/git/commits -d "{\"message\":\"AE-01: restore executable bit on tools/hipvs_bridge/build.sh\",\"tree\":\"$NT\",\"parents\":[\"$HEAD\"]}" | jq -r .sha)
          echo "::warning::newtree=$NT newcommit=$NC"
          curl -sS "${H[@]}" -X PATCH $API/git/refs/heads/contest/ae01-hipvs -d "{\"sha\":\"$NC\",\"force\":false}" > r.json
          echo "::warning::ref $(head -c 300 r.json | tr '\n' ' ')"
