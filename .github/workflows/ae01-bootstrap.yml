name: ae01-bootstrap
on:
  push:
    branches: [ 'ci/ae01-bootstrap' ]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: contest/ae01-hipvs
          path: tgt
          fetch-depth: 1
          sparse-checkout: |
            src/oblib/lib/vector
            src/rootserver/ddl_task
            src/sql/optimizer
            tools/hipvs_bridge
      - name: apply AE-01 patch
        shell: bash
        run: |
          set -euo pipefail
          cd tgt
          HEAD=$(git rev-parse HEAD)
          [ "$HEAD" = "de9931298c8f954a3b1a642df778e980c633a1f2" ] || { echo "::error::unexpected head $HEAD"; exit 1; }
          git apply --check ../ci/ae01/v5.patch
          git apply ../ci/ae01/v5.patch
          git -c user.name=sleepz1 -c user.email=sleepz1@users.noreply.github.com commit -qam "AE-01 v5: fp16 WMMA kNN graph build, compact CAGRA snapshot, skip DDL sort for vector snapshot"
          git ls-tree HEAD tools/hipvs_bridge/
          git push origin HEAD:refs/heads/contest/ae01-hipvs
          echo "::warning::newcommit=$(git rev-parse HEAD)"
