name: ae01-bootstrap
on:
  push:
    branches: [ 'ci/ae01-bootstrap' ]
permissions:
  contents: write
jobs:
  mkbranch:
    runs-on: ubuntu-latest
    steps:
      - name: try refs
        shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mk() {
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs \
              -d "{\"ref\":\"refs/heads/$1\",\"sha\":\"$2\"}" > o.json
            echo "::warning::$1 $(tr '\n' ' ' < o.json | head -c 300)"
          }
          mk tmp/ae01-master-test ${GITHUB_SHA}
          mk ae01/mergebase 977053bf16296429bab7b72522b2618e795ba6ae
          mk contest/ae01-hipvs 634888d9b037153fa143d2c913ba4b25503e1d62
          true
